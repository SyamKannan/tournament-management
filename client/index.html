<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1d" />
    <script>
      // Theme, language and text size are applied before the stylesheet paints,
      // so a light-theme reader never sees a dark flash. Mirrors
      // applyStoredPreferences() in src/i18n/index.tsx.
      (function () {
        try {
          var d = document.documentElement;
          var theme = localStorage.getItem('kickwick_theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          d.dataset.theme = dark ? 'dark' : 'light';
          d.style.colorScheme = dark ? 'dark' : 'light';
          var size = localStorage.getItem('kickwick_text_size');
          if (size === 'large' || size === 'larger') d.dataset.textSize = size;
          var lang = localStorage.getItem('kickwick_language');
          if (!lang && (navigator.language || '').toLowerCase().indexOf('ml') === 0) lang = 'ml';
          d.lang = lang === 'ml' ? 'ml' : 'en';
        } catch (e) {}
      })();
    </script>
    <title>KickWick – Live Sports Tournaments</title>
    <meta name="description" content="Run football and cricket tournaments: team registration, live scoring, TV scoreboards, points tables and ground fees." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Barlow+Semi+Condensed:wght@500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
