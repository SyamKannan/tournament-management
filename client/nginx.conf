# Front door for the platform.
#
# Serves the built SPA and proxies the two backend roles, so the browser talks
# to a single origin and the WebSocket upgrade works without a second hostname
# or a CORS exemption.

upstream sports_api {
    server api:8000;
}

upstream sports_ws {
    server ws:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded team logos and player photos come through the API; keep some
    # headroom over the API's own 12M limit.
    client_max_body_size 12m;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://sports_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The live gateway. The long read timeout keeps idle auction and scoreboard
    # sockets open between events instead of dropping them every minute.
    location /ws {
        proxy_pass http://sports_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Client-side routing: every unmatched path is handled by the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves browsers pointed at
    # asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
